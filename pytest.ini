[pytest]
asyncio_mode = strict
# Safety net, not a performance target - a genuine hang (e.g. a blocking
# call that freezes the whole server's event loop, as happened during
# development of the Gemini integration) would otherwise stall the entire
# suite indefinitely instead of failing loudly with a stack trace.
timeout = 60
# Explicit, not left to the platform default - pytest-timeout defaults to
# "signal" on Unix but "thread" on Windows (the only option there). Signal-
# based timeouts are known to interact unpredictably with the subprocess +
# asyncio + threading (asyncio.to_thread) combination this test suite uses.
# Pinning "thread" everywhere keeps behavior identical between local
# Windows runs and CI's Linux runner instead of silently differing.
timeout_method = thread
