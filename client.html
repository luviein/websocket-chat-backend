<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Chat Client</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --border: #e2e2e6;
            --text: #1c1c1f;
            --muted: #6b6b73;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --system-bg: #f0f0f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 0.5rem;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin: 0 0 0.75rem;
        }

        .row {
            display: flex;
            gap: 0.5rem;
        }

        .row + .row {
            margin-top: 0.5rem;
        }

        input {
            flex: 1;
            font-size: 0.9rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 0.9rem;
            border: none;
            border-radius: 7px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--system-bg);
        }

        .status {
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0.6rem 0 0;
        }

        .status.error {
            color: #c0392b;
        }

        .status.ok {
            color: #1f8a4c;
        }

        #messages {
            list-style: none;
            margin: 0;
            padding: 0;
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        #messages li {
            font-size: 0.88rem;
            padding: 0.45rem 0.65rem;
            border-radius: 7px;
            background: var(--bg);
            word-break: break-word;
        }

        #messages li.system {
            background: var(--system-bg);
            color: var(--muted);
            font-style: italic;
            text-align: center;
            font-size: 0.8rem;
        }

        .send-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="app">
        <div>
            <h1>Chat Client</h1>
            <p class="subtitle">Minimal test client for the WebSocket chat backend</p>
        </div>

        <div class="panel">
            <p class="panel-title">1. Register or Log In</p>
            <div class="row">
                <input id="authUsername" placeholder="username" value="user1" />
                <input id="authPassword" type="password" placeholder="password" value="password123" />
            </div>
            <div class="row">
                <button onclick="register()">Register</button>
                <button class="secondary" onclick="login()">Log In</button>
            </div>
            <p id="authStatus" class="status">Not logged in.</p>
        </div>

        <div class="panel">
            <p class="panel-title">2. Join a Room</p>
            <div class="row">
                <input id="room" placeholder="room name" value="general" />
                <button onclick="connect()">Connect</button>
            </div>
            <p id="connectStatus" class="status">Not connected.</p>
        </div>

        <div class="panel">
            <p class="panel-title">Chat</p>
            <ul id="messages"></ul>
            <div class="send-row">
                <input id="messageInput" placeholder="Type a message and press Enter" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let token = null;

        function isSystemMessage(text) {
            return (
                text.startsWith("---") ||
                text.endsWith("joined the room") ||
                text.endsWith("left the room")
            );
        }

        async function register() {
            await authRequest("/register");
        }

        async function login() {
            await authRequest("/login");
        }

        async function authRequest(path) {
            const username = document.getElementById("authUsername").value;
            const password = document.getElementById("authPassword").value;
            const status = document.getElementById("authStatus");

            const res = await fetch(`http://localhost:8000${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });

            if (!res.ok) {
                const err = await res.json();
                status.textContent = `Error: ${err.detail}`;
                status.className = "status error";
                return;
            }

            const data = await res.json();
            token = data.access_token;
            status.textContent = `Logged in as ${username}`;
            status.className = "status ok";
        }

        function connect() {
            const connectStatus = document.getElementById("connectStatus");
            if (!token) {
                connectStatus.textContent = "Register or log in first.";
                connectStatus.className = "status error";
                return;
            }

            const room = document.getElementById("room").value;
            ws = new WebSocket(`ws://localhost:8000/ws/${room}?token=${token}`);

            ws.onmessage = (event) => {
                const messages = document.getElementById("messages");
                const li = document.createElement("li");
                li.textContent = event.data;
                if (isSystemMessage(event.data)) {
                    li.classList.add("system");
                }
                messages.appendChild(li);
                messages.scrollTop = messages.scrollHeight;
            };

            ws.onopen = () => {
                connectStatus.textContent = `Connected to "${room}"`;
                connectStatus.className = "status ok";
            };

            ws.onclose = () => {
                connectStatus.textContent = "Disconnected.";
                connectStatus.className = "status error";
            };
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            if (ws && ws.readyState === WebSocket.OPEN && input.value.trim()) {
                ws.send(input.value);
                input.value = "";
            }
        }

        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
