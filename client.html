<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Chat Client</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --border: #e2e2e6;
            --text: #1c1c1f;
            --muted: #6b6b73;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --system-bg: #f0f0f5;
            --available: #22c55e;
            --away: #f59e0b;
            --invisible: #9ca3af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 0.5rem;
        }

        .hidden {
            display: none !important;
        }

        /* view slide-fade transition */
        .view-wrap {
            position: relative;
        }

        .view {
            transition: opacity 0.22s ease, transform 0.22s ease;
            opacity: 1;
            transform: translateX(0);
        }

        .view.entering {
            opacity: 0;
            transform: translateX(16px);
        }

        .view.leaving {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            opacity: 0;
            transform: translateX(-16px);
            pointer-events: none;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin: 0 0 0.75rem;
        }

        .row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .row + .row {
            margin-top: 0.5rem;
        }

        input {
            flex: 1;
            font-size: 0.9rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 0.9rem;
            border: none;
            border-radius: 7px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--system-bg);
        }

        .status {
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0.6rem 0 0;
        }

        .status.error {
            color: #c0392b;
        }

        .status.ok {
            color: #1f8a4c;
        }

        /* chat header bar: room name + change room / logout controls */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .chat-header .room-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .chat-header .actions {
            display: flex;
            gap: 0.4rem;
        }

        .chat-header button {
            font-size: 0.78rem;
            padding: 0.35rem 0.6rem;
        }

        #messages {
            list-style: none;
            margin: 0;
            padding: 0;
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        #messages li {
            font-size: 0.88rem;
            padding: 0.45rem 0.65rem;
            border-radius: 7px;
            background: var(--bg);
            word-break: break-word;
        }

        #messages li.system {
            background: var(--system-bg);
            color: var(--muted);
            font-style: italic;
            text-align: center;
            font-size: 0.8rem;
        }

        .send-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        /* presence panel: status picker sits to the side of the user grid */
        .presence-layout {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .status-picker {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            padding-right: 1rem;
        }

        .status-option {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 7px;
            padding: 0.25rem 0.4rem;
            cursor: pointer;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .status-option:hover {
            background: var(--system-bg);
        }

        .status-option.selected {
            border-color: var(--border);
            color: var(--text);
            font-weight: 500;
        }

        .status-option .dot-btn {
            width: 0.8rem;
            height: 0.8rem;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-option[data-status="available"] .dot-btn { background: var(--available); }
        .status-option[data-status="away"] .dot-btn { background: var(--away); }
        .status-option[data-status="invisible"] .dot-btn { background: var(--invisible); }

        /* online users grid */
        #userGrid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 0.5rem;
            align-content: flex-start;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.55rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 0.8rem;
            overflow: hidden;
        }

        .user-chip .dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .user-chip .dot.available { background: var(--available); }
        .user-chip .dot.away { background: var(--away); }
        .user-chip .dot.invisible { background: var(--invisible); }

        .user-chip .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-grid {
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="app">
        <div>
            <h1>Chat Client</h1>
            <p class="subtitle">Minimal test client for the WebSocket chat backend</p>
        </div>

        <div class="view-wrap">
            <!-- View 1: Register / Log In -->
            <div class="panel view" id="authView">
                <p class="panel-title">Register or Log In</p>
                <div class="row">
                    <input id="authUsername" placeholder="username" value="user1" />
                    <input id="authPassword" type="password" placeholder="password" value="password123" />
                </div>
                <div class="row">
                    <button onclick="register()">Register</button>
                    <button class="secondary" onclick="login()">Log In</button>
                </div>
                <p id="authStatus" class="status">Not logged in.</p>
            </div>

            <!-- View 2: Join a Room -->
            <div class="panel view hidden" id="roomView">
                <p class="panel-title">Join a Room</p>
                <div class="row">
                    <input id="room" placeholder="room name" value="general" />
                    <button onclick="connect()">Connect</button>
                </div>
                <p id="connectStatus" class="status"></p>
            </div>

            <!-- View 3: Chat Room -->
            <div class="view hidden" id="chatView" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="panel chat-header">
                    <span class="room-name">Room: <span id="currentRoomLabel"></span></span>
                    <div class="actions">
                        <button class="secondary" onclick="changeRoom()">Change Room</button>
                        <button class="secondary" onclick="logout()">Log Out</button>
                    </div>
                </div>

                <div class="panel">
                    <p class="panel-title">Online Now</p>
                    <div class="presence-layout">
                        <div class="status-picker">
                            <button class="status-option" data-status="available" onclick="setStatus('available')">
                                <span class="dot-btn"></span> Available
                            </button>
                            <button class="status-option" data-status="away" onclick="setStatus('away')">
                                <span class="dot-btn"></span> Away
                            </button>
                            <button class="status-option" data-status="invisible" onclick="setStatus('invisible')">
                                <span class="dot-btn"></span> Invisible
                            </button>
                        </div>
                        <div id="userGrid"><span class="empty-grid">No one here yet.</span></div>
                    </div>
                </div>

                <div class="panel">
                    <p class="panel-title">Chat</p>
                    <ul id="messages"></ul>
                    <div class="send-row">
                        <input id="messageInput" placeholder="Type a message and press Enter" />
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let token = null;
        let myStatus = "available";

        const views = {
            auth: document.getElementById("authView"),
            room: document.getElementById("roomView"),
            chat: document.getElementById("chatView"),
        };
        const TRANSITION_MS = 220;

        function showView(view) {
            const target = views[view];

            const currentEntry = Object.entries(views).find(
                ([name, el]) => name !== view && !el.classList.contains("hidden")
            );

            if (currentEntry) {
                const currentEl = currentEntry[1];
                currentEl.classList.add("leaving");
                setTimeout(() => {
                    currentEl.classList.remove("leaving");
                    currentEl.classList.add("hidden");
                }, TRANSITION_MS);
            }

            target.classList.remove("hidden");
            target.classList.add("entering");
            void target.offsetWidth; // force reflow so the transition animates from the "entering" state
            target.classList.remove("entering");
        }

        async function register() {
            await authRequest("/register");
        }

        async function login() {
            await authRequest("/login");
        }

        async function authRequest(path) {
            const username = document.getElementById("authUsername").value;
            const password = document.getElementById("authPassword").value;
            const status = document.getElementById("authStatus");

            const res = await fetch(`http://localhost:8000${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });

            if (!res.ok) {
                const err = await res.json();
                status.textContent = `Error: ${err.detail}`;
                status.className = "status error";
                return;
            }

            const data = await res.json();
            token = data.access_token;
            showView("room");
        }

        function connect() {
            const connectStatus = document.getElementById("connectStatus");
            const room = document.getElementById("room").value;
            ws = new WebSocket(`ws://localhost:8000/ws/${room}?token=${token}`);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "chat") {
                    addMessage(`${msg.username}: ${msg.content}`, false);
                } else if (msg.type === "system") {
                    addMessage(msg.content, true);
                } else if (msg.type === "presence") {
                    renderUserGrid(msg.users);
                }
            };

            ws.onopen = () => {
                document.getElementById("currentRoomLabel").textContent = room;
                document.getElementById("messages").innerHTML = "";
                showView("chat");
                setStatus(myStatus); // announce current status once connected
            };

            ws.onclose = () => {
                connectStatus.textContent = "Disconnected.";
                connectStatus.className = "status error";
                renderUserGrid([]);
            };
        }

        function changeRoom() {
            if (ws) {
                ws.onclose = null; // avoid the disconnect handler firing while we navigate away
                ws.close();
                ws = null;
            }
            document.getElementById("connectStatus").textContent = "";
            showView("room");
        }

        function logout() {
            if (ws) {
                ws.onclose = null;
                ws.close();
                ws = null;
            }
            token = null;
            document.getElementById("authPassword").value = "";
            document.getElementById("authStatus").textContent = "Not logged in.";
            document.getElementById("authStatus").className = "status";
            showView("auth");
        }

        function addMessage(text, isSystem) {
            const messages = document.getElementById("messages");
            const li = document.createElement("li");
            li.textContent = text;
            if (isSystem) li.classList.add("system");
            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

        function renderUserGrid(users) {
            const grid = document.getElementById("userGrid");
            grid.innerHTML = "";
            if (!users.length) {
                grid.innerHTML = '<span class="empty-grid">No one here yet.</span>';
                return;
            }
            for (const user of users) {
                const chip = document.createElement("div");
                chip.className = "user-chip";
                chip.innerHTML = `<span class="dot ${user.status}"></span><span class="name">${user.username}</span>`;
                grid.appendChild(chip);
            }
        }

        function setStatus(status) {
            myStatus = status;
            document.querySelectorAll(".status-option").forEach((btn) => {
                btn.classList.toggle("selected", btn.dataset.status === status);
            });
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "set_status", status }));
            }
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            if (ws && ws.readyState === WebSocket.OPEN && input.value.trim()) {
                ws.send(JSON.stringify({ type: "chat", content: input.value }));
                input.value = "";
            }
        }

        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        setStatus("available"); // initialize picker UI (doesn't send until connected)
        showView("auth");
    </script>
</body>
</html>
